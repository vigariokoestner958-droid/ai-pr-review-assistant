<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Reviewer — 监控看板</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Manrope:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:#F5F0E8;color:#3C1518}
  nav{background:#3C1518;padding:0 48px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .nav-title{font-family:'EB Garamond',serif;font-size:20px;color:#F5F0E8}
  .nav-links a{color:#F5F0E8;font-size:13px;text-decoration:none;margin-left:24px;opacity:.7}
  .nav-links a:hover{opacity:1}
  .nav-links span{color:#F5F0E8;font-size:13px;margin-left:24px;opacity:.7;cursor:pointer}
  .nav-links span:hover{opacity:1}
  main{max-width:1100px;margin:0 auto;padding:40px 24px}
  h2{font-family:'EB Garamond',serif;font-size:22px;color:#3C1518;margin-bottom:16px}
  .grid{display:grid;gap:20px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .card{background:#fff;border:1px solid #D6CFC4;padding:24px}
  .card:hover{border-color:#3C1518}
  .kpi-num{font-family:'EB Garamond',serif;font-size:42px;line-height:1;color:#3C1518}
  .kpi-label{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8B7E74;margin-top:4px}
  .kpi-sub{font-size:12px;color:#8B7E74;margin-top:8px}
  .section{margin-top:32px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 12px;border-bottom:1px solid #EDE8DE;text-align:left;vertical-align:middle}
  th{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8B7E74}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12px}
  .badge{display:inline-block;padding:4px 12px;font-size:12px;font-weight:600;color:#F5F0E8}
  .empty{color:#8B7E74;font-size:14px;padding:24px;text-align:center}
  .alert-warn{border-left:4px solid #B45309;padding:10px 14px;margin-bottom:8px;background:#FDF8F0}
  .alert-crit{border-left:4px solid #A44A3F;padding:10px 14px;margin-bottom:8px;background:#FDF6F5}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .trend-row{font-size:12px;margin-bottom:4px;font-family:monospace}
  @media(max-width:768px){.grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <span class="nav-title">X-Reviewer — 监控看板</span>
  <div class="nav-links">
    <a href="/">← 返回主页</a>
    <a href="/api/metrics" target="_blank">JSON API</a>
    <span onclick="location.reload()">刷新</span>
  </div>
</nav>
<main id="main">
  <p style="color:#8B7E74;padding:40px 0">加载中...</p>
</main>

<script>
async function load() {
  const res = await fetch('/api/metrics');
  const d = await res.json();
  render(d);
}

function render(d) {
  const s = d.summary || {};
  const alerts = d.alerts || [];
  const trend = d.daily_trend || [];
  const scores = d.score_distribution || {};
  const recent = d.recent || [];

  // 有帮助率
  const fbTotal = s.feedback_total || 0;
  const fbUp = s.feedback_up || 0;
  const helpful = fbTotal ? Math.round(fbUp / fbTotal * 100) : 0;
  const bar = '█'.repeat(Math.floor(helpful/10)) + '░'.repeat(10 - Math.floor(helpful/10));

  // 状态
  let worst = 'ok';
  for (const a of alerts) {
    if (a.level === 'crit') { worst = 'crit'; break; }
    if (a.level === 'warn') worst = 'warn';
  }
  const statusColor = {ok:'#3D7A4A',warn:'#B45309',crit:'#A44A3F'}[worst];
  const statusLabel = {ok:'正常',warn:'警告',crit:'严重'}[worst];

  // 告警 HTML
  let alertsHtml = '';
  for (const a of alerts) {
    if (a.level === 'ok') continue;
    const cls = a.level === 'crit' ? 'alert-crit' : 'alert-warn';
    alertsHtml += `<div class="${cls}">
      <span style="color:${statusColor};font-weight:600">[${a.level.toUpperCase()}]</span>
      <span style="margin-left:8px;font-size:14px">${a.message}</span>
    </div>`;
  }
  if (!alertsHtml) alertsHtml = '<p style="color:#3D7A4A;font-size:14px">✓ 所有指标正常</p>';

  // 趋势 HTML
  const last7 = trend.slice(-7);
  const maxV = Math.max(...last7.map(r => r.total), 1);
  let trendHtml = last7.length ? last7.map(r => {
    const barLen = Math.max(1, Math.round(r.total / maxV * 40));
    const errNote = r.errors ? ` <span style="color:#A44A3F">(${r.errors}err)</span>` : '';
    return `<div class="trend-row">${(r.day||'').slice(-5)} ${'█'.repeat(barLen)} ${r.total}${errNote}</div>`;
  }).join('') : '<p class="empty">暂无数据</p>';

  // 评分分布 HTML
  const totalScored = Object.values(scores).reduce((a,b)=>a+b,0) || 1;
  let scoreHtml = '';
  for (const [s_key, cnt] of Object.entries(scores).sort((a,b)=>+a[0]-+b[0])) {
    const pct = Math.round(cnt / totalScored * 100);
    const color = +s_key <= 3 ? '#A44A3F' : +s_key <= 6 ? '#B45309' : '#3D7A4A';
    scoreHtml += `<div class="bar-row">
      <span style="width:20px;font-size:13px;text-align:right">${s_key}</span>
      <div style="background:${color};height:14px;width:${Math.max(pct,1)}%;min-width:2px"></div>
      <span style="font-size:12px;color:#8B7E74">${cnt}</span>
    </div>`;
  }
  if (!scoreHtml) scoreHtml = '<p class="empty">暂无数据</p>';

  // 最近记录 HTML
  const icons = {APPROVE:'✅',REQUEST_CHANGES:'🚫',COMMENT:'💬',ERROR:'❌'};
  let recentRows = recent.map(r => {
    const icon = icons[r.verdict] || '—';
    const short = (r.pr_url||'').includes('github.com') ? r.pr_url.split('github.com/')[1] : r.pr_url;
    const errBadge = r.error ? `<span style="color:#A44A3F;font-size:11px">${r.error.slice(0,30)}</span>` : '';
    return `<tr>
      <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <a href="${r.pr_url}" style="color:#A44A3F;font-size:13px">${short}</a>
      </td>
      <td>${icon}</td>
      <td style="font-size:13px">${r.overall_score || '—'}/10</td>
      <td style="font-family:monospace;font-size:12px;color:#8B7E74">${r.high_count}H ${r.med_count}M ${r.low_count}L</td>
      <td style="font-size:12px;color:#8B7E74">${r.latency_ms || 0}ms</td>
      <td style="font-size:12px;color:#8B7E74">${(r.created_at||'').slice(0,16)}</td>
      <td>${errBadge}</td>
    </tr>`;
  }).join('');
  if (!recentRows) recentRows = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';

  const helpColor = helpful >= 70 ? '#3D7A4A' : helpful >= 50 ? '#B45309' : '#A44A3F';
  const errColor = (s.error_rate_pct||0) < 5 ? '#3D7A4A' : '#A44A3F';

  document.getElementById('main').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px">
      <h2 style="margin:0">系统状态</h2>
      <span class="badge" style="background:${statusColor}">${statusLabel}</span>
      <span style="font-size:13px;color:#8B7E74">最近 7 天 · ${s.total||0} 次分析</span>
    </div>

    <div class="grid grid-4">
      <div class="card">
        <div class="kpi-num" style="color:${helpColor}">${helpful}%</div>
        <div class="kpi-label">有帮助率（目标 >70%）</div>
        <div class="mono" style="margin-top:8px;color:#A44A3F">${bar}</div>
        <div class="kpi-sub">👍${fbUp} / 👎${fbTotal - fbUp} / 总${fbTotal}</div>
      </div>
      <div class="card">
        <div class="kpi-num">${(s.avg_latency_ms||0).toLocaleString()}</div>
        <div class="kpi-label">平均延迟（ms）</div>
        <div class="kpi-sub">P90: ${(s.p90_latency_ms||0).toLocaleString()}ms</div>
        <div class="kpi-sub">最大: ${(s.max_latency_ms||0).toLocaleString()}ms</div>
      </div>
      <div class="card">
        <div class="kpi-num" style="color:${errColor}">${(s.error_rate_pct||0).toFixed(1)}%</div>
        <div class="kpi-label">错误率（目标 <5%）</div>
        <div class="kpi-sub">错误次数: ${s.error_count||0}</div>
        <div class="kpi-sub">跳过次数: ${s.skip_count||0}</div>
      </div>
      <div class="card">
        <div class="kpi-num">${(s.avg_score||0).toFixed(1)}</div>
        <div class="kpi-label">平均质量评分（/10）</div>
        <div class="kpi-sub">✅${s.verdict_approve||0} 建议合并</div>
        <div class="kpi-sub">🚫${s.verdict_reject||0} 需修复 &nbsp;💬${s.verdict_comment||0} 供参考</div>
      </div>
    </div>

    <div class="section">
      <h2>告警状态</h2>
      <div class="card">${alertsHtml}</div>
    </div>

    <div class="section grid grid-2">
      <div class="card">
        <h2>每日分析量（最近 7 天）</h2>
        ${trendHtml}
      </div>
      <div class="card">
        <h2>评分分布</h2>
        ${scoreHtml}
      </div>
    </div>

    <div class="section">
      <h2>平均风险分布（每次分析）</h2>
      <div class="grid grid-3">
        <div class="card" style="text-align:center">
          <div class="kpi-num" style="color:#A44A3F">${(s.avg_high||0).toFixed(1)}</div>
          <div class="kpi-label">HIGH / 次</div>
        </div>
        <div class="card" style="text-align:center">
          <div class="kpi-num" style="color:#B45309">${(s.avg_med||0).toFixed(1)}</div>
          <div class="kpi-label">MEDIUM / 次</div>
        </div>
        <div class="card" style="text-align:center">
          <div class="kpi-num" style="color:#3D7A4A">${(s.avg_low||0).toFixed(1)}</div>
          <div class="kpi-label">LOW / 次</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>最近分析记录</h2>
      <div class="card" style="padding:0;overflow:hidden">
        <table>
          <thead><tr>
            <th>PR</th><th>判断</th><th>评分</th><th>风险</th><th>延迟</th><th>时间</th><th></th>
          </tr></thead>
          <tbody>${recentRows}</tbody>
        </table>
      </div>
    </div>

    <div style="margin-top:32px;font-size:12px;color:#8B7E74;text-align:center">
      数据每次刷新更新 · JSON API: <a href="/api/metrics" style="color:#A44A3F">/api/metrics</a>
    </div>
  `;
}

load().catch(e => {
  document.getElementById('main').innerHTML = `<p style="color:#A44A3F;padding:40px">加载失败：${e.message}</p>`;
});
</script>
</body>
</html>
